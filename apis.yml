aid: nextworld
name: Nextworld
description: >-
  Nextworld is a Denver, Colorado enterprise application platform company founded by members of the
  original JD Edwards team. Its AI-native, no-code platform lets enterprises build, extend and govern
  mission-critical applications on top of existing ERP investments — the company markets this as
  eliminating "Shadow ERP", the layer of spreadsheets and side systems that accumulates when an ERP
  cannot keep up. The platform surfaces to developers and agents through Developer Studio,
  Logic Builder, workflow automation, REST-based inbound and outbound endpoints, event emissions to
  AWS EventBridge, inbound webhooks, and a remote Model Context Protocol (MCP) server at
  apps.nextworld.net that exposes per-application record and workflow operations to MCP clients such
  as Claude and ChatGPT. Nextworld reports 600+ enterprise customers across distribution,
  manufacturing, engineering and construction, telecommunications, utilities, and food and beverage.
