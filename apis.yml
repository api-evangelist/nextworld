apis:
- name: Nextworld Platform REST API
  description: >-
    Inbound REST endpoints into the Nextworld Platform. Every table and logic block created in the
    platform automatically exposes a set of endpoints for fetching, inserting, updating and deleting
    records and for executing logic blocks. Authentication is a Basic Auth call whose JSON response
    returns the tenant-specific protocol://host:port plus an access token (8 minute lifetime) and a
    refresh token. The full endpoint reference is published inside the platform under
    Integrations > Endpoint Documentation and is not reachable without a tenant login, so no OpenAPI
    definition could be captured.
  humanURL: https://www.nextw.com/docs/developerstudiointeroperability
  baseURL: https://apps.nextworld.net
  tags:
  - REST
  - Interoperability
  tags_raw:
  - REST
  - Interoperability
  - Endpoints
  properties:
  - type: Documentation
    url: https://www.nextw.com/docs/developerstudiointeroperability
  - type: Authentication
    url: authentication/nextworld-authentication.yml
  - type: Lifecycle
    url: lifecycle/nextworld-lifecycle.yml
  - type: Webhooks
    url: asyncapi/nextworld-events-webhooks.yml
- name: Nextworld MCP Server
  description: >-
    Remote Model Context Protocol server operated by Nextworld at apps.nextworld.net/ai/mcp. An MCP
    client connects to a single application, project or metadata bundle via a per-user URL generated
    inside the platform, then reads, inserts, updates, deletes and creates records or transitions a
    record's workflow — always inside the calling user's platform permissions. Anonymous tools/list
    returns an RFC 9728 Bearer challenge pointing at the protected-resource metadata document, so the
    live tool schemas require an authenticated introspection.
  humanURL: https://www.nextw.com/docs/mcpserver
  baseURL: https://apps.nextworld.net/ai/mcp
  tags:
  - MCP
  - Agents
  - Artificial Intelligence
  properties:
