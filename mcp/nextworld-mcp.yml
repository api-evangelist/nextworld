source: >-
  https://www.nextw.com/docs/mcpserver and https://www.nextw.com/docs/developerstudiointeroperability
  (published, no login required), confirmed by direct JSON-RPC probes of
  https://apps.nextworld.net/ai/mcp on 2026-08-26.
name: Nextworld MCP Server
provider: Nextworld
status: published
deployment:
  mode: remote
  endpoint: https://apps.nextworld.net/ai/mcp
  auth: oauth
  verified: probed
  note: >-
    The endpoint requires a query parameter selecting the scope of the connection — one of app,
    mcpBundle or agenticProject — so the callable URL is per-application, e.g.
    https://apps.nextworld.net/ai/mcp?app=JournalEntry. Nextworld generates the URL for a user
    inside the platform via the "Get MCP URL" button. Two auth modes are documented: a per-user
    Personal Access Key carried as an apikey query parameter, and OAuth (documented for Claude
    Enterprise, where the tenant ID is entered as the OAuth Client ID and the user supplies their own
    Personal Access Key). There is no stdio package and no npx install — this is a hosted server only.
